workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: artifacts/mobile
    integrations:
      app_store_connect: "ONJJEM Codemagic"
environment:
      groups:
        - ios_release_vars
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.effortlessburn.app
      node: 22.12.0
      vars:
        BUNDLE_ID: com.effortlessburn.app
        ...

      node: 22.12.0
      vars:
        BUNDLE_ID: com.effortlessburn.app
        XCODE_WORKSPACE: ios/effortlessBURN.xcworkspace
        XCODE_SCHEME: effortlessBURN
        COREPACK_INTEGRITY_KEYS: "0"
    scripts:
      - name: DIAGNOSTIC canary check
        script: |
          echo "CANARY-VALUE-9284"
          date
          git -C $CM_BUILD_DIR log -1 --format="%H %s"
      - name: Install pnpm
        script: command -v pnpm || npm install -g pnpm
      - name: Install dependencies
        script: pnpm install --no-frozen-lockfile
      - name: Show app.json build number
        script: |
          echo "Current directory:"
          pwd
          echo "All app.json files in repo:"
          find $CM_BUILD_DIR -name "app.json" -not -path "*/node_modules/*"
          echo "Contents of ./app.json buildNumber:"
          cat app.json | grep -A1 buildNumber
      - name: Prebuild iOS
        script: npx expo prebuild --platform ios --clean
      - name: Check generated build number
        script: |
          grep -A1 CFBundleVersion ios/effortlessBURN/Info.plist
      - name: Patch Podfile for Xcode 26 fmt compat bug
        script: python3 scripts/patch-podfile.py
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Verify JS bundle builds cleanly
        script: |
          cd artifacts/mobile
          npx expo export --platform ios --output-dir /tmp/export-check

      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/effortlessBURN.xcworkspace \
            --scheme effortlessBURN
      - name: Locate ipa (diagnostic)
        script: find "$CM_BUILD_DIR" -name "*.ipa" -print
    artifacts:
      - "**/*.ipa"
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
