workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: artifacts/mobile
    integrations:
      app_store_connect: "ONJJEM Codemagic"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.effortlessburn.app
      node: 22.12.0
      vars:
        BUNDLE_ID: com.effortlessburn.app
        XCODE_WORKSPACE: ios/effortlessBURN.xcworkspace
        XCODE_SCHEME: effortlessBURN
        COREPACK_INTEGRITY_KEYS: "0"
    scripts:
      - name: Install pnpm
        script: command -v pnpm || npm install -g pnpm
      - name: Install dependencies
        script: pnpm install --no-frozen-lockfile
      - name: Set up Expo credentials
        script: npx expo install --fix
      - name: Prebuild iOS
        script: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/effortlessBURN.xcworkspace \
            --scheme effortlessBURN
    artifacts:
      - artifacts/mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
